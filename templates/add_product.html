<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand">
            FASHION HUB ADMIN
        </a>

        <div>

            <a href="/"
               class="nav-link d-inline">
               Home
            </a>

            <a href="/admin"
               class="nav-link d-inline">
               Admin
            </a>

            <a href="/logout"
               class="nav-link d-inline">
               Logout
            </a>

        </div>

    </div>

</nav>

<!-- ADD PRODUCT FORM -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="form-box">

                <h2 class="text-center mb-4">
                    Add New Product
                </h2>

                <form method="POST"
                      enctype="multipart/form-data">

                    <!-- PRODUCT NAME -->

                    <label class="mb-2">
                        Product Name
                    </label>

                    <input type="text"
                           name="name"
                           class="form-control mb-3"
                           placeholder="Enter Product Name"
                           required>

                    <!-- PRODUCT PRICE -->

                    <label class="mb-2">
                        Product Price
                    </label>

                    <input type="number"
                           name="price"
                           class="form-control mb-3"
                           placeholder="Enter Product Price"
                           required>

                    <!-- PRODUCT CATEGORY -->

                    <label class="mb-2">
                        Category
                    </label>

                    <select name="category"
                            class="form-control mb-3"
                            required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Men">
                            Men
                        </option>

                        <option value="Women">
                            Women
                        </option>

                        <option value="Kids">
                            Kids
                        </option>

                        <option value="Fashion">
                            Fashion
                        </option>

                    </select>

                    <!-- PRODUCT IMAGE -->

                    <label class="mb-2">
                        Upload Product Image
                    </label>

                    <input type="file"
                           name="image"
                           class="form-control mb-3"
                           required>

                    <!-- PRODUCT DESCRIPTION -->

                    <label class="mb-2">
                        Product Description
                    </label>

                    <textarea name="description"
                              class="form-control mb-4"
                              rows="5"
                              placeholder="Enter Product Description"
                              required>
                    </textarea>

                    <!-- SUBMIT BUTTON -->

                    <button class="btn btn-dark w-100">
                        Add Product
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
