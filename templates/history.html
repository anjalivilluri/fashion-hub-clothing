<!DOCTYPE html>
<html>

<head>

<title>Order History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h1 class="mb-4">
My Orders
</h1>

<table class="table table-bordered">

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Total</th>

</tr>

{% for order in orders %}

<tr>

<td>{{ order[0] }}</td>
<td>{{ order[1] }}</td>
<td>{{ order[2] }}</td>
<td>₹{{ order[5] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
