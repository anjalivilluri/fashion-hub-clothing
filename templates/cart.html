<!DOCTYPE html>
<html>

<head>

<title>Cart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">

<h1 class="mb-4">
Shopping Cart
</h1>

<table class="table table-bordered bg-white">

<tr>

<th>Image</th>
<th>Product</th>
<th>Price</th>
<th>Action</th>

</tr>

{% for item in cart_items %}

<tr>

<td width="150">

<img src="{{ item[4] }}"
     width="100">

</td>

<td>
{{ item[2] }}
</td>

<td>
₹{{ item[3] }}
</td>

<td>

<a href="/remove_cart/{{ item[0] }}"
   class="btn btn-danger">
Remove
</a>

</td>

</tr>

{% endfor %}

</table>

<h3>
Total Price :
₹{{ total }}
</h3>

<a href="/checkout"
   class="btn btn-success mt-3">
Proceed To Checkout
</a>

</div>

</body>
</html>
