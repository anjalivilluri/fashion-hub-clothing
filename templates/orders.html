<!DOCTYPE html>
<html>

<head>

<title>Orders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">

<h1 class="mb-4">
All Orders
</h1>

<table class="table table-bordered bg-white">

<tr>

<th>ID</th>
<th>Customer</th>
<th>Email</th>
<th>Phone</th>
<th>Address</th>
<th>Total</th>
<th>Action</th>

</tr>

{% for order in orders %}

<tr>

<td>{{ order[0] }}</td>
<td>{{ order[1] }}</td>
<td>{{ order[2] }}</td>
<td>{{ order[4] }}</td>
<td>{{ order[3] }}</td>
<td>₹{{ order[5] }}</td>

<td>

<a href="/delete_order/{{ order[0] }}"
   class="btn btn-danger">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
