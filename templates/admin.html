<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">

<h1 class="mb-5">
Admin Dashboard
</h1>

<div class="row">

<div class="col-md-4">

<div class="card p-4 shadow text-center">

<h2>{{ products }}</h2>

<h4>Total Products</h4>

</div>

</div>

<div class="col-md-4">

<div class="card p-4 shadow text-center">

<h2>{{ orders }}</h2>

<h4>Total Orders</h4>

</div>

</div>

<div class="col-md-4">

<div class="card p-4 shadow text-center">

<h2>{{ users }}</h2>

<h4>Total Users</h4>

</div>

</div>

</div>

<div class="mt-5">

<a href="/add_product"
   class="btn btn-dark">
Add Product
</a>

<a href="/orders"
   class="btn btn-success">
Manage Orders
</a>

</div>

</div>

</body>
</html>
