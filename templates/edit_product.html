<!DOCTYPE html>
<html>

<head>

<title>Edit Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-7">

<div class="form-box">

<h2 class="text-center mb-4">
Edit Product
</h2>

<form method="POST"
      enctype="multipart/form-data">

<input type="text"
       name="name"
       value="{{ product[1] }}"
       class="form-control mb-3"
       required>

<input type="number"
       name="price"
       value="{{ product[2] }}"
       class="form-control mb-3"
       required>

<select name="category"
        class="form-control mb-3">

<option value="Men">
Men
</option>

<option value="Women">
Women
</option>

<option value="Kids">
Kids
</option>

<option value="Fashion">
Fashion
</option>

</select>

<input type="file"
       name="image"
       class="form-control mb-3">

<textarea name="description"
          class="form-control mb-3"
          rows="5">
{{ product[5] }}
</textarea>

<button class="btn btn-success w-100">
Update Product
</button>

</form>

</div>

</div>

</div>

</div>

</body>
</html>
